name: build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # Ubuntu 24.04 ships the oldest supported Qt (6.4) and FFmpeg (6.1): the API floor.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            qt6-base-dev libgl-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            ffmpeg xvfb xauth libgl1-mesa-dri mesa-utils
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test fixtures
        run: tests/fixtures/gen_fixtures.sh
      - name: Test
        # GL tests need a display: run everything on Xvfb with Mesa's llvmpipe (no GPU on CI;
        # hardware-decoding and CUDA tests skip themselves).
        run: scripts/xvfb-run.sh ctest --preset dev
      - name: Package
        run: |
          cmake --preset release
          cmake --build --preset release
          cd build/release && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: scvp-linux
          path: build/release/scvp-*.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install qt ffmpeg ninja pkg-config
      - name: Configure
        run: cmake --preset dev -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        run: cmake --build --preset dev
      - name: Test fixtures
        run: tests/fixtures/gen_fixtures.sh
      - name: Test
        run: ctest --preset dev
      - name: Package
        run: |
          cmake --preset release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build --preset release
          cd build/release && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: scvp-macos
          path: build/release/scvp-*.dmg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
      - name: FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BtbN's "latest" release only carries the newest release branches (the pinned n7.1 asset
          # was dropped), so take the newest nX.Y LGPL shared build; never master, whose API moves.
          $asset = gh release view latest -R BtbN/FFmpeg-Builds --json assets -q '.assets[].name' |
            Where-Object { $_ -match '^ffmpeg-n\d+\.\d+-latest-win64-lgpl-shared-' } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n(\d+\.\d+)-.*$', '$1') } |
            Select-Object -Last 1
          if (-not $asset) { throw 'no win64 LGPL shared release build in BtbN/FFmpeg-Builds' }
          Write-Host "FFmpeg: $asset"
          gh release download latest -R BtbN/FFmpeg-Builds -p $asset -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $root = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName
          "FFMPEG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure
        run: cmake --preset dev -DFFMPEG_ROOT="${{ env.FFMPEG_ROOT }}"
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        # Without fixtures (the LGPL FFmpeg build has no x264/x265 encoders): unit tests only.
        run: ctest --preset dev
      - name: Package
        run: |
          cmake --preset release -DFFMPEG_ROOT="${{ env.FFMPEG_ROOT }}"
          cmake --build --preset release
          cd build/release
          cpack
      - name: Check package
        # The zip must run on a clean PC: every import shipped (FFmpeg's own DLLs, the VC++
        # runtime), and the program opens a video with nothing but Windows on PATH.
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=25 -frames:v 25 -c:v mpeg4 -q:v 2 clip.mp4
          Expand-Archive (Get-Item build/release/scvp-*.zip).FullName -DestinationPath unpacked
          scripts/check-windows-bundle.ps1 -Dir (Get-ChildItem unpacked -Directory)[0].FullName -Clip clip.mp4
      - name: Installer
        # Per-user setup.exe (NSIS) with the zip's files and the icon drawn by scvp itself.
        run: |
          Expand-Archive (Get-Item build/release/scvp-*.zip).FullName -DestinationPath stage
          $src = (Get-ChildItem stage -Directory)[0].FullName
          Start-Process "$src\bin\scvp.exe" -ArgumentList '--export-ico', "$src\scvp.ico" -Wait -NoNewWindow
          if (-not (Test-Path "$src\scvp.ico")) { throw 'scvp.exe --export-ico wrote nothing' }
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress; $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          $version = (Get-Item build/release/scvp-*.zip).Name -replace '^scvp-(.*)-win64\.zip$', '$1'
          & $makensis /V2 "/DVERSION=$version" "/DSRC=$src" "/DOUT=$PWD\build\release\scvp-$version-win64-setup.exe" packaging\windows\scvp.nsi
          if ($LASTEXITCODE) { throw "makensis failed ($LASTEXITCODE)" }
      - name: Check installer
        # Silent install, the same checks on the installed copy, the registrations, then a silent
        # uninstall that leaves nothing behind.
        run: |
          $setup = (Get-Item build/release/scvp-*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\SCVP"
          scripts/check-windows-bundle.ps1 -Dir $dir -Clip clip.mp4
          $keys = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SCVP',
                  'HKCU:\Software\Classes\SCVP.video\shell\open\command',
                  'HKCU:\Software\Classes\.mp4\OpenWithProgids',
                  'HKCU:\Software\Classes\Applications\scvp.exe\SupportedTypes',
                  'HKCU:\Software\SCVP\Capabilities\FileAssociations'
          foreach ($k in $keys) { if (-not (Test-Path $k)) { throw "not registered: $k" } }
          if ((Get-ItemProperty HKCU:\Software\RegisteredApplications).SCVP -ne 'Software\SCVP\Capabilities') { throw 'not in RegisteredApplications' }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\SCVP.lnk"
          if (-not (Test-Path $lnk)) { throw 'no Start menu entry' }
          # The uninstaller copies itself to TEMP and returns at once: wait for the folder to go.
          Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          $left = @($dir, $lnk) + $keys | Where-Object { Test-Path $_ }
          if ((Get-ItemProperty HKCU:\Software\RegisteredApplications).SCVP) { $left += 'RegisteredApplications\SCVP' }
          if ($left) { throw "left after uninstall: $($left -join ', ')" }
          Write-Host 'installer: install, run, registrations and uninstall OK'
      - uses: actions/upload-artifact@v4
        with:
          name: scvp-windows
          path: |
            build/release/scvp-*.zip
            build/release/scvp-*-setup.exe
